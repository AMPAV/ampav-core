[project]
name = "ampav-core"
dynamic = ["version"]
description = "Core Libraries/Schemas/Utilties for the AMPAV environment"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",   
]
authors = [
    {name = "Brian Wheeler", email="bdwheele@iu.edu"},
    {name = "Ying Feng", email="yingfeng@iu.edu"},
]

requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pyyaml",
    "av",
    "boto3",
    "pillow"
]

[project.scripts]
ampav_compound = "ampav.core.cli_utilities:cli_compound_tool"
ampav_convert = "ampav.core.cli_utilities:cli_convert_tool"
ampav_probe_media = "ampav.core.schema.av_metadata:cli_probe_media"
ampav_import_3play_json = "ampav.core.file_formats.threeplay:cli_import_threeplay_json"
ampav_import_text_transcript = "ampav.core.file_formats.textfile:cli_import_text_transcript"
ampav_render_html = "ampav.core.cli_utilities:cli_render_tool"
ampav_transcript_to_webvtt = "ampav.core.file_formats.webvtt:cli_transcript_to_webvtt"

[project.urls]
Homepage = "https://github.com/AMPAV/ampav-core"
Repository = "https://github.com/AMPAV/ampav-core.git"
Issues = "https://github.com/AMPAV/ampav-core/issues"



[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "ampav.core.__version__"}
